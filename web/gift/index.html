<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A puzzle for you · Studio Jigsaw</title>
  <meta name="description" content="Someone sent you a jigsaw puzzle. Open it in Studio Jigsaw.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Newsreader:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f9f9ff; --text: #141b2b; --muted: #404945; --primary: #255345; --card: #ffffff; --line: #e2e5e9; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141b2b; --text: #edf0ff; --muted: #c0c8c3; --primary: #a1d1be; --card: #1e2637; --line: #293040; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; padding: 16px; }
    main { max-width: 420px; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; text-align: center; }
    h1 { font-family: Newsreader, Georgia, serif; font-weight: 400; font-size: 30px; margin: 12px 0 8px; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 20px; }
    a.btn { display: block; padding: 14px 18px; border-radius: 8px; font-weight: 600; text-decoration: none; margin-top: 10px; }
    a.primary { background: #255345; color: #fff; }
    a.store { border: 1px solid var(--line); color: var(--text); }
    small { display: block; margin-top: 18px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <svg width="56" height="56" viewBox="0 0 120 120" aria-hidden="true"><rect width="120" height="120" rx="28" fill="#3E6B5C"/><g fill="none" stroke="#fff" stroke-width="4.5" stroke-linejoin="round"><path d="M38 32C45 32 45 22 56 22C67 22 67 32 74 32L88 32L88 46C88 53 98 53 98 64C98 75 88 75 88 82L88 88L74 88C67 88 67 98 56 98C45 98 45 88 38 88L32 88L32 74C32 67 22 67 22 56C22 45 32 45 32 38Z"/><circle cx="56" cy="60" r="14" stroke-width="3.5"/></g><circle cx="56" cy="60" r="5" fill="#fff"/></svg>
    <h1>A puzzle, just for you</h1>
    <p>Someone sent you a jigsaw puzzle made from their own photo. Open it in Studio Jigsaw. No account needed.</p>
    <a class="btn primary" id="open" href="#">Open my puzzle</a>
    <!-- Replace both store links once the app is live (see SETUP_CHECKLIST.md). -->
    <a class="btn store" id="ios" href="https://apps.apple.com/app/idREPLACE_ME">Get it on the App Store</a>
    <a class="btn store" id="android" href="https://play.google.com/store/apps/details?id=com.studiojigsaw.app">Get it on Google Play</a>
    <small>After installing, tap this link again and your gift opens straight away.</small>
  </main>
  <script>
    // /gift/<token> -> studiojigsaw://gift/<token>. With universal links set up, installed apps never see this page.
    var token = location.pathname.split('/').filter(Boolean).pop();
    if (token && token !== 'gift') {
      document.getElementById('open').href = 'studiojigsaw://gift/' + encodeURIComponent(token);
      var play = document.getElementById('android');
      play.href += '&referrer=' + encodeURIComponent('gift=' + token);
    }
  </script>
</body>
</html>
